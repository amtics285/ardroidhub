<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR DroidHub</title>
  <meta name="description" content="AR DroidHub - a free store to download Android apps.">
  <link rel="icon" type="image/png" href="img/logo-64.png">
  <link rel="apple-touch-icon" href="img/logo-192.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
  <link rel="preload" href="img/logo.png" as="image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="#/" aria-label="AR DroidHub home">
      <img class="logo-img" src="img/logo.png" alt="" width="38" height="38">
      <span>AR DroidHub</span>
    </a>
    <form class="search" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="Search apps" autocomplete="off" aria-label="Search apps">
    </form>
    <button class="search-toggle" id="searchToggle" type="button" aria-label="Search" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <nav id="nav" class="nav"></nav>
  </header>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Menu"></aside>

  <main id="view" class="container"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <a class="brand" href="#/" aria-label="AR DroidHub home">
          <img class="logo-img" src="img/logo-64.png" alt="" width="40" height="40">
          <span>AR DroidHub</span>
        </a>
        <p>Free Android apps, straight to your phone.</p>
      </div>
      <nav class="footer-col" aria-label="Company">
        <h4>Company</h4>
        <a href="#/about">About us</a>
        <a href="#/company">Our company</a>
      </nav>
      <nav class="footer-col" aria-label="Help">
        <h4>Help</h4>
        <a href="#/support">Support</a>
        <a href="#/privacy">Privacy policy</a>
      </nav>
      <nav class="footer-col" aria-label="Developers">
        <h4>Developers</h4>
        <a href="#/become-developer">Become a developer</a>
        <a href="#/terms">Developer policy</a>
      </nav>
    </div>
    <div class="footer-bar">&copy; AR DroidHub. All rights reserved.</div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
