name: Deploy site and upload Worker

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            GH_PAT
            MAIL_KEY
            CODE_SECRET
            SMTP_USER
            SMTP_PASS
            FIREBASE_SERVICE_ACCOUNT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MAIL_KEY: ${{ secrets.MAIL_KEY }}
          CODE_SECRET: ${{ secrets.CODE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  site:
    needs: worker
    # Publish the site even if the Worker step failed (e.g. a Cloudflare API outage);
    # the Worker that is already deployed keeps working.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Find the Worker URL
        id: wurl
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=$(curl -sS -m 30 -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain' 2>/dev/null || true)
          if [ -z "$sub" ] || [ "$sub" = "null" ]; then
            # Cloudflare API hiccup: fall back to the subdomain registered by setup-workers-subdomain.yml
            echo "Cloudflare API did not answer, using the known subdomain." >&2
            sub=ardroidhub
          fi
          echo "url=https://ardroidhub-upload.${sub}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Put the Worker URL into the site config
        env:
          WORKER_URL: ${{ steps.wurl.outputs.url }}
        run: sed -i "s|__WORKER_URL__|${WORKER_URL}|" site/js/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
