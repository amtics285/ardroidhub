name: Verify email

# Started by the Cloudflare Worker after the user typed the right 6-digit code.
on:
  workflow_dispatch:
    inputs:
      uid:
        description: Firebase user id
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ inputs.uid }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: bot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - name: Mark email as verified
        working-directory: bot
        env:
          TARGET_UID: ${{ inputs.uid }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python mark_verified.py
